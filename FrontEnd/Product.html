<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Prodotto</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="product">

<input type="checkbox" id="menu-toggle">

<nav class="sidebar">
    <label for="menu-toggle" class="toggle-btn">
        <svg class="arrow" viewBox="0 0 24 24">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
        </svg>
    </label>

    <label style="color: white; position: absolute; text-align:center; margin-left:70px; font-size:35px; margin-top:10px">
        Menù
    </label>

    <form method="GET" action="" style="margin-top: 85px; margin-left: 10px">

        <!-- ✅ Tag dinamici dal database -->
        {% for tag in tags %}
            <input
                type="checkbox"
                id="tag-{{ tag.id }}"
                name="tag"
                value="{{ tag.id }}"
                class="checkbox"

            >
            <label for="tag-{{ tag.id }}" class="window-text"> {{ tag.nome }} </label><br>
        {% empty %}
            <p style="color: white; margin-left: 5px;">Nessun tag disponibile</p>
        {% endfor %}

        <br>
        <input type="submit" value="Filtra" style="margin-left: -5px">
    </form>

</nav>

<div class="content">
    <!-- Qui va il contenuto principale della pagina -->
</div>

</body>
</html>
